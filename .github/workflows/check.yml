# Every change: the profiles against the JSON Schema, then each profile read by the real engine of LibreHU service
# (librehu-car-tool.jar: examples, engine requirement). On main, the packs by make are rebuilt (dist/).
name: Check and build packs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily as well, in case a push started no run.
  schedule:
    - cron: "37 3 * * *"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # revisions = commits per make

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Schema
        run: |
          pip install --quiet jsonschema
          python3 tools/build_packs.py --check

      - name: Engine of LibreHU service (examples, engine requirement)
        run: |
          # The tool published with the service, else built from its sources (same engine).
          if ! curl -fsSL -o librehu-car-tool.jar https://github.com/LibreHU/LibreHU-service/releases/download/latest-main/librehu-car-tool.jar; then
            git clone --depth 1 https://github.com/LibreHU/LibreHU-service.git "$RUNNER_TEMP/service"
            (cd "$RUNNER_TEMP/service" && ./gradlew --no-daemon -q :core:carToolJar)
            cp "$RUNNER_TEMP/service/core/build/libs/librehu-car-tool.jar" .
          fi
          java -jar librehu-car-tool.jar version
          java -jar librehu-car-tool.jar check brands/

      - name: Packs by make
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/build_packs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git diff --cached --quiet || git commit -m "Packs: rebuilt from brands/ [skip ci]" && git push
